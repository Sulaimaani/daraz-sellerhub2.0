components:
  schemas:
    ClaimEvidence:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          maxLength: 50
        file:
          type: string
          format: uri
        caption:
          type: string
          maxLength: 500
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        checksum:
          type: string
          maxLength: 64
        exif_stripped:
          type: boolean
        claim:
          type: integer
      required:
      - claim
      - file
      - id
      - kind
      - uploaded_at
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 255
        address_line:
          type: string
      required:
      - id
    FinanceAudit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issues:
          type: array
          items:
            $ref: '#/components/schemas/FinanceIssue'
          readOnly: true
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        run_at:
          type: string
          format: date-time
          readOnly: true
        run_by:
          type: string
          maxLength: 255
        status:
          type: string
          maxLength: 50
        orders_examined:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        revenue_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        deductions_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        net_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        expected_profit:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        actual_profit:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        loss_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        issues_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        report: {}
        export_file:
          type: string
          format: uri
          nullable: true
        store:
          type: string
          format: uuid
      required:
      - id
      - issues
      - period_end
      - period_start
      - run_at
      - store
    FinanceIssue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue_type:
          type: string
          maxLength: 100
        severity:
          type: string
          maxLength: 50
        title:
          type: string
          maxLength: 255
        description:
          type: string
        amount_impact:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        evidence: {}
        resolved:
          type: boolean
        resolved_note:
          type: string
        audit:
          type: integer
        order:
          type: integer
          nullable: true
        order_item:
          type: integer
          nullable: true
      required:
      - audit
      - id
      - issue_type
      - severity
      - title
    FinanceTransaction:
      type: object
      properties:
        transaction_type:
          type: string
          maxLength: 100
        fee_name:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        transaction_date:
          type: string
          format: date-time
          nullable: true
      required:
      - fee_name
      - transaction_type
    OrderDetail:
