name: daraz-saas
region: sgp1

databases:
  - name: daraz-db
    engine: PG
    cluster_name: daraz-db
    production: true

  - name: daraz-cache
    engine: REDIS
    cluster_name: daraz-cache
    production: true

services:
  - name: backend
    github:
      branch: main
      repo: Sulaimaani/daraz-sellerhub2.0
    source_dir: backend
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xs
    run_command: gunicorn config.wsgi:application --bind 0.0.0.0:${PORT}
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${daraz-db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${daraz-cache.REDIS_URL}
      - key: DJANGO_SETTINGS_MODULE
        scope: RUN_TIME
        value: config.settings.staging
      - key: ALLOWED_HOSTS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: AUTH_COOKIE_DOMAIN
        scope: RUN_TIME
        value: ${APP_DOMAIN}
      - key: SECRET_KEY
        type: SECRET
      - key: DARAZ_APP_KEY
        type: SECRET
      - key: DARAZ_APP_SECRET
        type: SECRET
      - key: DARAZ_REDIRECT_URI
        type: SECRET
      - key: FIELD_ENCRYPTION_KEY
        type: SECRET
      - key: SPACES_ACCESS_KEY_ID
        type: SECRET
      - key: SPACES_SECRET_ACCESS_KEY
        type: SECRET
      - key: SPACES_BUCKET_NAME
        value: daraz-saas-assets
      - key: SPACES_ENDPOINT_URL
        value: https://sgp1.digitaloceanspaces.com
      - key: SPACES_REGION_NAME
        value: sgp1
      - key: DARAZ_MOCK
        value: "true"
    health_check:
      http_path: /healthz/
    http_port: 8080
    routes:
      - path: /api

  - name: frontend
    github:
      branch: main
      repo: Sulaimaani/daraz-sellerhub2.0
    source_dir: frontend
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xs
    build_command: npm run build
    run_command: npm start
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}/api
    http_port: 3000
    routes:
      - path: /

workers:
  - name: worker
    github:
      branch: main
      repo: Sulaimaani/daraz-sellerhub2.0
    source_dir: backend
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-s
    run_command: celery -A config worker -l INFO
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${daraz-db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${daraz-cache.REDIS_URL}
      - key: DJANGO_SETTINGS_MODULE
        scope: RUN_TIME
        value: config.settings.staging

  - name: beat
    github:
      branch: main
      repo: Sulaimaani/daraz-sellerhub2.0
    source_dir: backend
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xs
    run_command: celery -A config beat -l INFO
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${daraz-db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${daraz-cache.REDIS_URL}
      - key: DJANGO_SETTINGS_MODULE
        scope: RUN_TIME
        value: config.settings.staging

jobs:
  - name: release
    github:
      branch: main
      repo: Sulaimaani/daraz-sellerhub2.0
    source_dir: backend
    environment_slug: python
    kind: PRE_DEPLOY
    run_command: python manage.py migrate && python manage.py collectstatic --noinput
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${daraz-db.DATABASE_URL}
      - key: DJANGO_SETTINGS_MODULE
        scope: RUN_TIME
        value: config.settings.staging
      - key: SPACES_ACCESS_KEY_ID
        type: SECRET
      - key: SPACES_SECRET_ACCESS_KEY
        type: SECRET
      - key: SPACES_BUCKET_NAME
        value: daraz-saas-assets
      - key: SPACES_ENDPOINT_URL
        value: https://sgp1.digitaloceanspaces.com
      - key: SPACES_REGION_NAME
        value: sgp1
