name: daraz-saas
region: nyc3

databases:
  - name: db
    engine: PG
    version: "16"
    production: true

  - name: redis
    engine: REDIS
    version: "7"
    production: true

services:
  - name: backend
    github:
      branch: main
      repo: your-github-user/daraz-saas # UPDATE THIS
    source_dir: backend
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xs
    run_command: gunicorn config.wsgi:application --bind 0.0.0.0:${PORT}
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.REDIS_URL}
      - key: DJANGO_SETTINGS_MODULE
        scope: RUN_TIME
        value: config.settings.staging
      - key: ALLOWED_HOSTS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: AUTH_COOKIE_DOMAIN
        scope: RUN_TIME
        value: ${APP_DOMAIN}
      # The following must be set via DO App Console Secrets:
      # SECRET_KEY, DARAZ_APP_KEY, DARAZ_APP_SECRET, DARAZ_REDIRECT_URI, SPACES_*
    health_check:
      http_path: /healthz/
    http_port: 8080
    routes:
      - path: /api

  - name: frontend
    github:
      branch: main
      repo: your-github-user/daraz-saas # UPDATE THIS
    source_dir: frontend
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xs
    build_command: npm run build
    run_command: npm start
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}/api
    http_port: 3000
    routes:
      - path: /

workers:
  - name: worker
    github:
      branch: main
      repo: your-github-user/daraz-saas # UPDATE THIS
    source_dir: backend
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xs
    run_command: celery -A config worker -l INFO
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.REDIS_URL}
      - key: DJANGO_SETTINGS_MODULE
        scope: RUN_TIME
        value: config.settings.staging

  - name: beat
    github:
      branch: main
      repo: your-github-user/daraz-saas # UPDATE THIS
    source_dir: backend
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xs
    run_command: celery -A config beat -l INFO
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.REDIS_URL}
      - key: DJANGO_SETTINGS_MODULE
        scope: RUN_TIME
        value: config.settings.staging

jobs:
  - name: release
    github:
      branch: main
      repo: your-github-user/daraz-saas # UPDATE THIS
    source_dir: backend
    environment_slug: python
    kind: PRE_INSTALL
    run_command: python manage.py migrate && python manage.py collectstatic --noinput
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DJANGO_SETTINGS_MODULE
        scope: RUN_TIME
        value: config.settings.staging
      # Note: Spaces env vars for collectstatic must be provided
