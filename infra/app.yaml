name: daraz-saas
region: nyc
envs:
  - key: DEBUG
    value: "0"
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings.production
  - key: SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db.DATABASE_URL}
  - key: REDIS_URL
    scope: RUN_TIME
    value: ${redis.REDIS_URL}
  - key: FIELD_ENCRYPTION_KEY
    scope: RUN_TIME
    type: SECRET

services:
  - name: backend
    github:
      branch: main
      repo: your-org/daraz-saas
      deploy_on_push: true
    source_dir: backend
    environment_slug: python
    build_command: pip install -r requirements.txt && python manage.py collectstatic --noinput
    run_command: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    http_port: 8080
    instance_count: 1
    instance_size_slug: professional-xs
    health_check:
      http_path: /healthz
      initial_delay_seconds: 15
      period_seconds: 10

  - name: frontend
    github:
      branch: main
      repo: your-org/daraz-saas
      deploy_on_push: true
    source_dir: frontend
    environment_slug: node-js
    build_command: npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: professional-xs

workers:
  - name: worker
    github:
      branch: main
      repo: your-org/daraz-saas
      deploy_on_push: true
    source_dir: backend
    environment_slug: python
    build_command: pip install -r requirements.txt
    run_command: celery -A config worker -l info
    instance_count: 1
    instance_size_slug: professional-xs

  - name: beat
    github:
      branch: main
      repo: your-org/daraz-saas
      deploy_on_push: true
    source_dir: backend
    environment_slug: python
    build_command: pip install -r requirements.txt
    run_command: celery -A config beat -l info
    instance_count: 1
    instance_size_slug: professional-xs

databases:
  - name: db
    engine: PG
    version: "15"
    production: true
    cluster_name: daraz-db-cluster

  - name: redis
    engine: REDIS
    version: "7"
    production: true
    cluster_name: daraz-redis-cluster
