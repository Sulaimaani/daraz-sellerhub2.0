version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: daraz_saas
      POSTGRES_USER: daraz_user
      POSTGRES_PASSWORD: daraz_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daraz_user -d daraz_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://daraz_user:daraz_password@postgres:5432/daraz_saas
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=1
      - SECRET_KEY=supersecretkey-for-local-dev
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - FIELD_ENCRYPTION_KEY=N0L2Fh3GZtT7mJbXk2O4u1N6V-A3R8zYc9kQ7aBwR6k=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgres://daraz_user:daraz_password@postgres:5432/daraz_saas
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=1
      - SECRET_KEY=supersecretkey-for-local-dev
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - FIELD_ENCRYPTION_KEY=N0L2Fh3GZtT7mJbXk2O4u1N6V-A3R8zYc9kQ7aBwR6k=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgres://daraz_user:daraz_password@postgres:5432/daraz_saas
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=1
      - SECRET_KEY=supersecretkey-for-local-dev
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - FIELD_ENCRYPTION_KEY=N0L2Fh3GZtT7mJbXk2O4u1N6V-A3R8zYc9kQ7aBwR6k=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api

volumes:
  postgres_data:
